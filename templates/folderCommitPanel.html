<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
    <link rel="stylesheet" href="{{STYLE_URI}}">
</head>
<body>
    <div class="filter-section">
        <div class="checkbox-group">
            <label>
                <input type="checkbox" id="modified-checkbox" checked>
                已修改
            </label>
            <label>
                <input type="checkbox" id="added-checkbox" checked>
                新增
            </label>
            <label>
                <input type="checkbox" id="deleted-checkbox" checked>
                已删除
            </label>
            <label>
                <input type="checkbox" id="unversioned-checkbox" checked>
                未版本控制
            </label>
            <label>
                <input type="checkbox" id="missing-checkbox" checked>
                丢失
            </label>
        </div>
        <div class="extension-filter">
            <label class="extension-filter-label">文件后缀筛选：</label>
            <div class="extension-tags-container" id="extensionTagsContainer">
                <!-- 动态生成的后缀标签将在这里显示 -->
            </div>
            <div class="extension-actions">
                <button class="extension-action-btn" id="selectAllExtensions" title="选择全部后缀">全选</button>
                <button class="extension-action-btn" id="clearAllExtensions" title="清除全部选择">清空</button>
            </div>
        </div>
        <div class="changelist-filter">
            <label class="changelist-filter-label">Changelist：</label>
            <select id="changelistFilter">
                {{CHANGELIST_OPTIONS}}
            </select>
        </div>
        {{FILTER_INFO}}
    </div>

    <div class="batch-actions">
        <span id="selectedCount" class="selected-count">已选 0 项</span>
        <button id="revertSelectedButton" class="batch-button revert" title="恢复选中文件的本地修改（丢弃未提交的修改，不可撤销）" disabled>恢复选中</button>
        <button id="deleteSelectedButton" class="batch-button delete" title="删除选中的文件（版本控制中的文件计划删除，未版本控制的文件移入回收站）" disabled>删除选中</button>
        <span class="batch-separator"></span>
        <input type="text" id="changelistNameInput" class="changelist-input" placeholder="Changelist名称">
        <button id="setChangelistButton" class="batch-button" title="将选中的文件加入指定的 changelist（未版本控制的文件会被跳过）">加入Changelist</button>
        <button id="removeChangelistButton" class="batch-button" title="将选中的文件移出所在 changelist">移出Changelist</button>
    </div>

    <div class="file-list-container">
        <div class="file-list">
            <div class="file-list-header">
                <span class="checkbox-cell">
                    <input type="checkbox" id="selectAll">
                </span>
                <span>文件名</span>
                <span>路径</span>
                <span class="file-status">状态</span>
                <span class="file-action">操作</span>
            </div>
            <div id="fileListContent">
                {{FILE_LIST}}
            </div>
        </div>
    </div>

    <div class="commit-section">
        <div class="prefix-section">
            <div class="prefix-container">
                <select id="prefixSelect">
                    {{PREFIX_OPTIONS}}
                </select>
                <input type="text" id="prefixInput" class="prefix-input" placeholder="日志前缀" value="{{LATEST_PREFIX}}">
                <button id="applyPrefixButton">应用前缀</button>
            </div>
        </div>
        <textarea id="commitMessage" placeholder="请输入提交信息">{{LATEST_PREFIX}}</textarea>
        <div class="button-container">
            <button id="submitButton">提交</button>
            <button id="generateAIButton">使用AI生成提交日志</button>
        </div>
    </div>

    <script src="{{SCRIPT_URI}}"></script>
</body>
</html>
